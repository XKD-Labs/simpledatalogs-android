# Publishes both artifacts to Maven Central through the Sonatype Central Portal when a tag v<version> is pushed.
name: Publish to Maven Central

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central

    steps:
      # actions/checkout v7.0.1, pinned by commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-java v6.1.0, pinned by commit.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android v4.0.4, pinned by commit.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      # gradle/actions/setup-gradle v6.4.0, pinned by commit; no cache writes from a release.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-read-only: true

      # The tag must match gradle.properties, so a mistyped tag never publishes.
      - name: Check the tag matches the version
        run: |
          version_name="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
          if [ "v$version_name" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION_NAME $version_name" >&2
            exit 1
          fi

      - name: Test
        run: ./gradlew :simpledatalogs-core:test :simpledatalogs:testReleaseUnitTest :simpledatalogs:lintRelease

      # Uploads, signs and releases both publications in one Central Portal deployment.
      - name: Publish
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
