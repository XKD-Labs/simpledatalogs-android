# Runs the JVM core tests and the Android build, unit tests and lint on every push and pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  jvm-core:
    runs-on: ubuntu-latest

    steps:
      # actions/checkout v7.0.1, pinned by commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-java v6.1.0, pinned by commit.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"

      # gradle/actions/setup-gradle v6.4.0, pinned by commit.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Test the core
        run: ./gradlew -PjvmOnly=true :simpledatalogs-core:build

  android:
    runs-on: ubuntu-latest

    steps:
      # actions/checkout v7.0.1, pinned by commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # actions/setup-java v6.1.0, pinned by commit.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android v4.0.4, pinned by commit.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      # gradle/actions/setup-gradle v6.4.0, pinned by commit.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Build, test and lint the Android library
        run: ./gradlew assembleRelease :simpledatalogs:testReleaseUnitTest :simpledatalogs:lintRelease
